:root{ --ink:#4a3729; }
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:#1c2b22;}
body{ font-family:'Trebuchet MS','Segoe UI',sans-serif; display:flex; justify-content:center; }
#frame{
  position:relative;
  width:460px;
  max-width:100vw;
  overflow:hidden;
  box-shadow:0 0 50px rgba(0,0,0,0.55);
  image-rendering:pixelated;
  background:#7fb35f;
}
.terrain{
  position:absolute; left:0; right:0;
  background-repeat:no-repeat;
  background-size:100% 100%;
  image-rendering:pixelated;
  z-index:0;
}
.terrain.fadeTop{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, black 260px);
  mask-image:linear-gradient(to bottom, transparent 0, black 260px);
}
.terrain::after{
  content:"";
  position:absolute; inset:0;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,0.16), transparent 38%),
    radial-gradient(circle at 85% 25%, rgba(255,255,255,0.10), transparent 35%);
}
.deco{
  position:absolute;
  image-rendering:pixelated;
  filter:drop-shadow(0 6px 4px rgba(0,0,0,0.3));
  z-index:4;
  pointer-events:none;
  transform-origin:50% 92%;
}
.deco.sway{ animation:sway 3.6s ease-in-out infinite alternate; }
@keyframes sway{ 0%{ transform:rotate(-1.6deg); } 100%{ transform:rotate(1.6deg); } }

.critter{
  position:absolute;
  image-rendering:pixelated;
  z-index:4;
  pointer-events:none;
  filter:drop-shadow(0 4px 3px rgba(0,0,0,0.3));
}
.critter.sit{
  animation:sitbob 2.6s ease-in-out infinite;
  transform-origin:bottom center;
}
@keyframes sitbob{ 0%,100%{transform:scaleY(1);} 50%{transform:scaleY(0.97);} }

.sprite8{
  position:absolute;
  image-rendering:pixelated;
  z-index:4;
  pointer-events:none;
  background-repeat:no-repeat;
}

  border-radius:50%;

  user-select:none;

.node .base{

  background-repeat:no-repeat;
  image-rendering:pixelated;

  filter:drop-shadow(0 6px 3px rgba(0,0,0,0.35));
  transition:transform .15s ease;
}

  text-shadow:0 1px 0 rgba(255,255,255,0.5); letter-spacing:0.5px;

.node.locked .num{ color:#5b5b5b; opacity:0.8; }
.node.current .base{ animation:pulse 1.1s ease-in-out infinite; }

.stars{

  display:flex; gap:2px; z-index:6; pointer-events:none;

}
.lock::before{
  content:""; position:absolute; top:-13px; left:5px; width:12px; height:14px;

  const x = CENTER + AMP*Math.sin((i)*(Math.PI/2.15));
  const biome = i<7 ? 'grass' : 'ruins';
  nodes.push({i, x, y, biome});
}
const TOTAL_H = TOP_PAD + (N-1)*SPACING + 260;
document.getElementById('frame').style.height = TOTAL_H+'px';

// ---------- terrain: actual tiles from Grass Land 2.0 + Ancient Ruins ----------
const terrainLayer=document.getElementById('terrainLayer');
const ruinsTop=Math.round(TOP_PAD+5.5*SPACING);
function addTiledTerrain(sheet,top,height,srcX,srcY){
  const wrap=document.createElement('div');
  wrap.className='terrain';
  wrap.style.top=top+'px'; wrap.style.height=height+'px'; wrap.style.background='none';
  const canvas=document.createElement('canvas');
  canvas.width=FRAME_W; canvas.height=Math.max(1,height);
  canvas.style.width='100%'; canvas.style.height='100%'; canvas.style.display='block';
  const ctx=canvas.getContext('2d'); ctx.imageSmoothingEnabled=false;
  const img=new Image();
  img.onload=()=>{
    for(let y=0;y<canvas.height;y+=32){
      for(let x=0;x<canvas.width;x+=32) ctx.drawImage(img,srcX,srcY,32,32,x,y,32,32);
    }
  };
  img.src=sheet; wrap.appendChild(canvas); terrainLayer.appendChild(wrap);
}
addTiledTerrain(PACK_ASSETS.grassSheet,0,ruinsTop,0,0);
addTiledTerrain(PACK_ASSETS.ancientTerrain,ruinsTop,TOTAL_H-ruinsTop,640,288);

// ---------- decorations (cropped straight from the bundled asset packs) ----------
const decoLayer = document.getElementById('decoLayer');
function addDeco(src, x, y, w, h, opts){
  const im = document.createElement('img');
  im.src = src;
  im.className='deco' + (opts && opts.sway ? ' sway' : '');
  im.style.left = x+'px'; im.style.top = y+'px';
  im.style.width = w+'px'; im.style.height = h+'px';
  if(opts && opts.delay) im.style.animationDelay = opts.delay;
  if(opts && opts.flip) im.style.transform = (im.style.transform||'') + ' scaleX(-1)';
  decoLayer.appendChild(im);
}
function render(){
  nodeLayer.innerHTML = '';
  nodes.forEach((n, idx)=>{
    const unlocked = idx===0 || completed[idx-1] || completed[idx];
    const el = document.createElement('div');
    el.className = 'node' + (unlocked ? '' : ' locked') + (idx===current ? ' current' : '');
    el.style.left = n.x+'px';
    el.style.top = n.y+'px';

    const base = document.createElement('div');
    base.className = 'base';
    base.style.backgroundImage = `url('${unlocked ? btnForBiome(n.biome) : ASSETS.btnLocked}')`;
    const num = document.createElement('span');
    num.className='num';
    num.textContent = (idx+1);
    base.appendChild(num);
    el.appendChild(base);

    if(completed[idx]){
      const starsWrap = document.createElement('div');
      starsWrap.className='stars';
      for(let s=0;s<3;s++){
        const st = document.createElement('img');
        st.src = s < starsArr[idx] ? ASSETS.starFull : ASSETS.starEmpty;
        starsWrap.appendChild(st);
      }
      el.appendChild(starsWrap);
    }
    if(!unlocked){
      const lk = document.createElement('div');
      lk.className='lock';
      el.appendChild(lk);
    }

    el.addEventListener('click', ()=>onNodeClick(idx, el));
    nodeLayer.appendChild(el);
  });
  placeCat(current, false);
}

function placeCat(idx, animate){
  const n=nodes[idx], side=(idx%2===0)?-1:1;
  if(!attachedPlayerCat) return;
  attachedPlayerCat.style.left=(n.x+side*54)+'px';
  attachedPlayerCat.style.top=(n.y+8)+'px';
  attachedPlayerCat.style.transform=side<0?'translate(-50%,-100%)':'translate(-50%,-100%) scaleX(-1)';
}

function spawnPaws(x,y){
  for(let k=0;k<5;k++){
    const p = document.createElement('div');
    p.className='paw';
    p.style.left = (x-20+Math.random()*40)+'px';
    p.style.top = (y-20+Math.random()*40)+'px';
    p.style.opacity = '1';
    decoLayer.appendChild(p);
    let op=1;
    const iv = setInterval(()=>{
      op -= 0.05;
      p.style.opacity = op;
      if(op<=0){ clearInterval(iv); p.remove(); }
    }, 40);
  }
}

function onNodeClick(idx, el){
  const unlocked = idx===0 || completed[idx-1] || completed[idx];
  if(!unlocked){
    el.classList.add('shake');
    setTimeout(()=>el.classList.remove('shake'), 400);
    return;
  }
  current = idx;
  placeCat(idx, true);
  if(!completed[idx]){
    completed[idx] = true;
    starsArr[idx] = 1 + Math.floor(Math.random()*3);
    spawnPaws(nodes[idx].x, nodes[idx].y);
  }
  render();
}

render();
</script>

function catmullRom2bezier(pts){
  let d=`M ${pts[0].x} ${pts[0].y} `;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6;
    const c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C ${c1x} ${c1y}, ${c2x} ${c2y}, ${p2.x} ${p2.y} `;
  }
  return d;
}
const pathD=catmullRom2bezier(nodes);
